[project]
name = "wawapacha-pipeline"
version = "0.1.0"
description = "Notebooks de marimo que descargan, validan y publican los datos de WawaPacha."
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.13",
    "plotly[express]>=6",
    "polars>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
