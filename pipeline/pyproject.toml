[project]
name = "wawapacha-pipeline"
version = "0.1.0"
description = "Descarga, valida y publica los datos de WawaPacha."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
wawapacha-pipeline = "wawapacha_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Los notebooks de ../notebooks; la producción no los instala.
notebooks = ["marimo>=0.13", "plotly[express]>=6", "polars>=1"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wawapacha_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
