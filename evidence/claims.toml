locator = "Official NOAA CPC ENSO Strength Probabilities, Additional Information"
quote = "Probabilities are verified using the Relative Oceanic Niño Index (RONI), using incremental -/+ 0.5 degree Celsius thresholds in sea surface temperature departures averaged in the Niño-3.4 region of the east-central equatorial Pacific Ocean (170–120W, 5S–5N)."

[[claim.source]]
ref = "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/strengths/"
locator = "Official NOAA CPC ENSO Strength Probabilities, Additional Information"
quote = "The strength of El Niño or La Niña does not necessarily correspond with the strength of the influence or expected impact."

[[claim.source]]
ref = "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/strengths/"
locator = "Official NOAA CPC ENSO Strength Probabilities, Additional Information"
quote = "A 0% chance is approximate and not exact, meaning there is still some finite, non-zero chance (e.g. .01%) of the outcome occurring."

