locator = "SENAMHI, Informe Técnico N° 69-2026/SENAMHI-DMA-SPC, Mapas de anomalías extremas de precipitación durante eventos El Niño/Oscilación Sur (1983, 1998, 2016) y El Niño Costero (2017, 2023), periodo enero-marzo (June 2026), PDF p. 7 of 21, section 4.1, Mapa N° 3 paragraph"
quote = "el evento 2017 presentó condiciones húmedas generalizadas en gran parte del territorio durante el trimestre EFM"

[[claim]]
id = "senamhi-69-2026-nino-costero-composite-coasts"
claim_es = "En el compuesto de máximas anomalías de SENAMHI para El Niño Costero (EFM 2017 y 2023), las anomalías más extremas (>250 %) están en la costa norte entre 3°S y 6°S, y la señal húmeda se extiende a lo largo de toda la franja costera hasta unos 17,5°S con anomalías muy húmedas (100 %–250 %). El compuesto es el máximo celda por celda de dos eventos."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "SENAMHI, Informe Técnico N° 69-2026/SENAMHI-DMA-SPC (June 2026), PDF p. 7 of 21, section 4.1, Mapa N° 3 paragraph, sentence 1"
quote = "Las anomalías más extremas (>250%, extremadamente húmedo) se registran en la costa norte entre los 3°S y 6°S (Tumbes, Piura, Lambayeque), con el núcleo más intenso entre 4°S y 5.5°S."

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 7 of 21, section 4.1, Mapa N° 3 paragraph, sentence 2 (part)"
quote = "la señal húmeda se extiende de forma más continua y pronunciada a lo largo de toda la franja costera hasta aproximadamente los 17.5°S con anomalías muy húmedas (100%–250%)"

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 4 of 21, section 3.4"
quote = "seleccionar, para cada celda de la grilla, el valor más extremo registrado entre los eventos analizados"

[[claim]]
id = "senamhi-69-2026-nino-costero-composite-limits"
claim_es = "SENAMHI advierte que el patrón del compuesto de El Niño Costero no debe interpretarse como el comportamiento típico de un Niño Costero en EFM, sino como el escenario más extremo registrado entre 2017 y 2023; que en la costa árida las anomalías porcentuales deben leerse en términos cualitativos; y que en 2023 el calentamiento costero se consolidó hacia marzo, con lluvias intensificadas por el ciclón Yaku en la costa norte y central."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "SENAMHI, Informe Técnico N° 69-2026/SENAMHI-DMA-SPC (June 2026), PDF p. 7 of 21, section 4.1, last sentence of the Mapa N° 3 paragraph"
quote = "Por ello, el patrón del composite no debe interpretarse como el comportamiento típico de un Niño Costero en el trimestre EFM, sino como el escenario más extremo registrado entre ambos eventos para el territorio."

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 4 of 21, section 3.3"
quote = "en zonas con climatología de referencia cercana a cero — principalmente la costa árida— pequeñas diferencias absolutas de precipitación pueden traducirse en anomalías porcentuales muy elevadas. Por ello, los valores en estos sectores deben interpretarse en términos cualitativos, identificando la presencia o ausencia de exceso o déficit, más que como magnitudes absolutas comparables con otras regiones."

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 7 of 21, section 4.1, Mapa N° 3 paragraph"
quote = "mientras que en 2023 el calentamiento costero se consolidó principalmente hacia marzo, mes en que el sistema ciclónico Yaku intensificó las lluvias en la costa norte y central."

[[claim]]
id = "senamhi-69-2026-enso-canonical-south-coast"
claim_es = "En los compuestos de SENAMHI para El Niño/ENOS canónico (EFM 1983, 1998 y 2016), la señal negativa más intensa se concentra en la costa sur y la sierra sur, con anomalías extremadamente secas (-100 % a -75 %) de Ica a Tacna entre 13°S y 18°S, liderada por el evento 2015–2016; en el compuesto de máximos de los mismos eventos, la franja costera centro y sur hasta 18°S muestra anomalías de moderadamente húmedas a muy húmedas (15 %–250 %), con núcleos >250 % en las cuencas medias de Lima, Ica, Huancavelica, Arequipa, Moquegua y Tacna."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "SENAMHI, Informe Técnico N° 69-2026/SENAMHI-DMA-SPC (June 2026), PDF p. 6 of 21, section 4.1, Mapa N° 2 paragraph, sentence 1"
quote = "La señal negativa más intensa se concentra en la costa sur y sierra sur — tanto occidental como oriental — con un núcleo de anomalías extremadamente secas (-100% a -75%) que se extiende de forma continua desde Ica hasta Tacna y desde Ayacucho hasta Puno entre los 13°S y 18°S"

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 6 of 21, section 4.1, Mapa N° 2 paragraph, sentence 4"
quote = "Este patrón está liderado por el evento 2015-2016, que generó déficits generalizados en la sierra central y sur, mientras que los eventos 1982-1983 y 1997-1998 contribuyeron con déficits severos concentrados principalmente en la sierra sur."

[[claim.source]]
ref = "https://cdn.www.gob.pe/uploads/document/file/10162024/8270210-69_informe-tecnico-cenepred_epx-2026-0006823_ppv_acn_jcr_lsh_ywef_rev-f-f.pdf"
locator = "same document, PDF p. 6 of 21, section 4.1, Mapa N° 1 paragraph, sentence 2 (part)"
quote = "hacia la franja costera centro y sur hasta los 18°S con anomalías moderadamente húmedas a muy húmedas (15%–250%), con núcleos destacados >250%, asociados a las cuencas medias de Lima, Ica, Huancavelica, Arequipa, Moquegua y Tacna."

[[claim]]
id = "igp-sanabria-2018-meridional-mode"
claim_es = "El boletín técnico del IGP (agosto de 2018) dice que el primer modo de la lluvia en eventos fuertes de El Niño representa precipitación intensa en el norte de Perú y lluvias leves en las zonas costeras del sur, con un nodo en la latitud de Lima (12°S), y que al sur de ese nodo las anomalías tienden a ser negativas en las tierras altas pero aún positivas cerca de la costa. El estudio cubre 1972–73, 1982–83, 1997–98 y 2015–16, no el Niño Costero de 2017."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://repositorio.igp.gob.pe/bitstreams/76006852-0412-4eda-a783-90cd342aa18e/download"
locator = "IGP, Janeet Sanabria Quispe, Lluvias a lo largo de la costa del Perú durante los eventos fuertes de El Niño, Boletín Técnico Vol. 5 N° 8 (August 2018), PDF p. 4 of 5, Conclusiones, paragraph 1"
quote = "el primer modo representa la precipitación intensa en la parte norte del Perú y las lluvias leves en las zonas costeras del sur, caracterizándose por un patrón de see-saw meridional (Ep) con un nodo en la latitud de Lima (12°S)"

[[claim.source]]
ref = "https://repositorio.igp.gob.pe/bitstreams/76006852-0412-4eda-a783-90cd342aa18e/download"
locator = "same document, PDF p. 3 of 5, paragraph on the Ep pattern"
quote = "Al sur de esta última, las anomalías de la precipitación durante los eventos extremos de El Niño tienden a ser negativas en las tierras altas, pero aún positivas cerca de la costa."

[[claim]]
id = "sanabria-2018-abstract"
claim_es = "Sanabria et al. (2018) encuentran que los eventos extremos de El Niño de 1982/1983 y 1997/1998 tienen una proyección dominante sobre el modo Ep, con fuerte carga en el norte, y que todos los eventos fuertes se asocian con anomalías positivas de lluvia en el norte de Perú. Solo se leyó el resumen."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://doi.org/10.1002/joc.5292"
locator = "Sanabria, Bourrel, Dewitte, Frappart, Rau, Solis, Labat (2018), Rainfall along the coast of Peru during strong El Niño events, International Journal of Climatology 38(4): 1737–1747, abstract as returned by Crossref for the DOI; the full text was not reachable"
quote = "It is shown that the extreme 1982/1983 and 1997/1998 El Niño events have a dominant projection on the Ep mode that has a strong loading in the northern region"

[[claim.source]]
ref = "https://doi.org/10.1002/joc.5292"
locator = "same abstract, sentence 6"
quote = "while all events are associated with positive rainfall anomalies in the northern part of Peru which is accounted for by the Ep mode, the evolution of rainfall anomalies along the Cp mode exhibits a significant dispersion."

[[claim]]
id = "lavado-espinoza-2014-abstract"
claim_es = "Lavado y Espinoza (2014) confirman que la parte norte de la vertiente del Pacífico presenta un aumento de las lluvias durante El Niño fuerte, mientras que la región sur andina de esa vertiente presenta disminución. Solo se leyó el resumen; ubica la disminución en la región andina, no en la costa."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://doi.org/10.1590/S0102-77862014000200003"
locator = "Lavado Casimiro & Espinoza Villar (2014), Impactos de El Niño y La Niña en las lluvias del Perú (1965-2007), Revista Brasileira de Meteorologia 29(2), abstract as returned by Crossref for the DOI, sentence 3; the full text was not reachable"
quote = "Nuestro análisis confirma que la parte norte de la VP presenta un aumento de las lluvias durante ENF, mientras que la región sur andina de la VP presenta disminución (aumento) de lluvias durante ENF (LNF)."

[[claim]]
id = "rau-2017-abstract"
claim_es = "Rau et al. (2017) describen una regionalización de la lluvia en la vertiente del Pacífico y la costa de Perú en la que el ENOS se manifiesta como mayor lluvia en las regiones de aguas abajo del norte durante El Niño extremo y menor lluvia en las regiones de aguas arriba durante El Niño del Pacífico central. Solo se leyó el resumen."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://doi.org/10.1002/joc.4693"
locator = "Rau, Bourrel, Labat, Melo, Dewitte, Frappart, Lavado, Felipe (2017), Regionalization of rainfall over the Peruvian Pacific slope and coast, International Journal of Climatology 37(1): 143–158, abstract as returned by Crossref for the DOI, sentence 5"
quote = "increased rainfall over downstream regions in northern Peru during extreme El Niño events and decreased rainfall over upstream regions along the Pacific slope during central Pacific El Niño events"

[[claim]]
id = "senamhi-2015-south-basins-1983-1998"
