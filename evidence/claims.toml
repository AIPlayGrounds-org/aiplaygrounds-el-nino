claim_es = "ENFEN informó que en el verano de 2017 la anchoveta se desplazó al sur de los 10°S (Huarmey), estuvo replegada hacia la costa y no desovó, y que aumentó la disponibilidad de recursos de aguas cálidas como caballa, bonito y atunes. El informe no da toneladas."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "ENFEN, Informe Técnico Extraordinario N° 001-2017/ENFEN, PDF p. 29, last paragraph of the conclusions before section 4 Recomendaciones"
quote = "La anchoveta, especie clave del ecosistema marino peruano, mostró un desplazamiento hacia el sur de los 10°S (Huarmey) y estuvo replegada hacia la costa, desde Salaverry hasta el extremo sur del litoral peruano; no presentó actividad reproductiva ni desove durante el verano. Además, se detectó el incremento de la disponibilidad de recursos asociados a aguas cálidas, como caballa, bonito y atunes en todo el litoral peruano."

[[claim]]
id = "enfen-it2017-station-rain-records"
claim_es = "ENFEN informa que en febrero y marzo de 2017 la estación Morropón (Piura) registró el 22 de febrero la precipitación más alta del registro histórico de febrero (150 mm en 24 h), la estación Partidor (Tambo Grande, Piura) 258,5 mm en 24 h el día 3 de marzo y la estación Jayanca (Lambayeque) 113 mm en 24 h el día 4, el segundo valor más alto de toda su serie. Son totales de 24 horas, no del evento."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "ENFEN, Informe Técnico Extraordinario N° 001-2017/ENFEN. El Niño Costero 2017, PDF p. 19, section 2.2 \"Lluvias intensas\", paragraph 2"
quote = "registrarse en la estación meteorológica Morropón (Piura) para el día 22 de febrero la precipitación más alta del registro histórico de febrero (150 mm/24hrs)"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "same document, PDF p. 19, section 2.2, paragraph 2, a later sentence"
quote = "sobresalen algunos récords de precipitaciones extremas encontrados el día 03 en la estación Partidor (Tambo Grande, Piura) con 258,5 mm/24hrs y el día 04 en la estación Jayanca (Lambayeque) reportó el segundo valor más alto de toda su serie histórica con 113 mm/24hrs."

[[claim]]
id = "enfen-it2017-rain-intensity-classes"
claim_es = "ENFEN dice que en 2017 hubo lluvias de \"fuertes\" a \"extremadamente fuertes\", principalmente en las zonas bajas y medias de Tumbes, Piura y Lambayeque, y que Piura, Chiclayo, Trujillo y Huarmey soportaron lluvias intensas que superaron récords históricos observados solamente en eventos El Niño extraordinarios. En el informe las lluvias \"fuertes\", \"muy fuertes\" y \"extremadamente fuertes\" son los percentiles 90, 95 y 99 de la precipitación diaria."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "ENFEN, Informe Técnico Extraordinario N° 001-2017/ENFEN, PDF p. 19, section 2.2, paragraph 1, sentence 2"
quote = "Ciudades como Piura, Chiclayo, Trujillo y Huarmey soportaron lluvias intensas que superaron records históricos observados solamente en eventos El Niño extraordinarios."

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "same document, PDF p. 19, section 2.2, paragraph 1, sentence 3"
quote = "se presentaron lluvias entre “fuerte” a “extremadamente fuertes” (SENAMHI, 2015), principalmente en las zonas bajas y medias de Tumbes, Piura y Lambayeque"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "same document, PDF p. 19, footnote 2"
quote = "“Lluvias muy fuertes” se definen como el percentil 95% de la precipitación diaria; “lluvias fuertes” se definen como el percentil 90% de la precipitación diaria y “lluvias extremadamente fuertes” se definen como el percentil 99% de la precipitación diaria."

[[claim]]
id = "enfen-it2017-accumulation-vs-1983-1998"
claim_es = "ENFEN dice que la precipitación acumulada entre enero y marzo de 2017 en las zonas bajas de Piura y Lambayeque fue menor que la del mismo periodo de El Niño 1997/1998, similar a la acumulada durante El Niño 1982/1983 al mes de marzo y posiblemente superior a lo estimado para El Niño de 1925. El texto no da cifras."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "ENFEN, Informe Técnico Extraordinario N° 001-2017/ENFEN, PDF p. 19, section 2.2, last sentence of paragraph 2"
quote = "No obstante la intensidad de las lluvias, la precipitación acumulada entre enero y marzo en las zonas bajas de Piura y Lambayeque fueron menores a lo observado en el mismo periodo durante El Niño 1997/1998, similar a lo acumulado durante El Niño 1982/1983 al mes de marzo y posiblemente superior a lo estimado para El Niño de 1925 (Takahashi y Martínez, 2017)."

[[claim]]
id = "enfen-it2017-affected-regions"
claim_es = "ENFEN dice que las principales manifestaciones de El Niño Costero 2017 fueron el incremento sustancial de las lluvias y de los caudales de los ríos en las regiones históricamente afectadas por El Niño extraordinarios: Tumbes, Piura, Lambayeque, La Libertad, Ancash, Lima e Ica. No da cantidades."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/informe-tecnico-el-nino-costero-2017/"
locator = "ENFEN, Informe Técnico Extraordinario N° 001-2017/ENFEN, PDF p. 29, section 3 Conclusiones, bullet 2"
quote = "Las principales manifestaciones de El Niño Costero 2017 fueron el incremento sustancial de las lluvias y por ende los caudales de los ríos en las regiones históricamente afectadas por el fenómeno El Niño extraordinarios: Tumbes, Piura, Lambayeque, La Libertad, así como Ancash, Lima e Ica."

[[claim]]
id = "senamhi-69-2026-2017-generalised-humid"
claim_es = "SENAMHI dice que el evento de 2017 presentó condiciones húmedas generalizadas en gran parte del territorio durante el trimestre EFM; \"gran parte del territorio\" no es la costa."
status = "verified"
