[[claim]]
id = "chirps-pentad-6-days"
claim_es = "En CHIRPS cada mes tiene seis pentadas: las cinco primeras tienen cinco días y la sexta, de entre 3 y 6 días, cierra el mes. CHC añade que los productos diarios rnl y sat suman el mismo total pentadal de CHIRPS3."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://earlywarning.usgs.gov/fews/product/190/"
locator = "FEWS NET, CHIRPS Pentadal Rainfall, Documentation, entry \"pentadal\""
quote = "The first 5 pentads of each month have 5 days. The last pentad, or 6th pentad, of each month can have as few as 3 days (for example, Feb with 28 days in non-leap years) and as many as 6 days (Jan, Mar, May, Jul, Aug, Oct, Dec, with 31 days)."

[[claim.source]]
ref = "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/readme.txt"
