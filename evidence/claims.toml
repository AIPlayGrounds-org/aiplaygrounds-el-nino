locator = "Nota Técnica ENFEN 02-2026, PDF p. 1, lines 13-18"
quote = "el cual consta de cinco “estados”, uno de los cuales será anunciado en cada Comunicado Oficial (CO) de la Comisión ENFEN."

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-02-2026-sistema-de-alerta-ante-el-nino-costero-y-la-nina-costera/"
