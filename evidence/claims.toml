[[claim]]
id = "icen-moving-climatology"
claim_es = "ENFEN calcula las anomalías del ICEN con climatologías de 30 años que cambian cada cinco años (la primera, 1931–1960; la siguiente, 1936–1965; la actual, 1991–2020); desde 2006 se usa 1991–2020, y para los quinquenios posteriores a 2010 se emplea esa misma climatología de forma temporal. La fuente es el producto ERSSTv5 de NOAA para Niño 1+2. Los umbrales de categoría se definen por percentiles respecto del periodo base 1950–2023, y la próxima actualización del ICEN y sus umbrales será en 2031."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 2, section 2, first paragraph"
quote = "es decir se calculan las climatologías cada 5 años: siendo la primera, la del periodo 1931 a 1960; la siguiente, la del periodo 1936 a 1965 y así sucesivamente hasta el periodo actual que va de 1991 a 2020."

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 2, section 2, Tabla 1, rows for 2006-2010 and 2011-2015"
quote = "2006-2010 1991-2020 2011-2015 1991-2020*"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 2, Tabla 1, note under the table"
quote = "* Para los quinquenios posteriores al 2010 se emplea temporalmente la climatología 1991-2020, en tanto no se completen los periodos de las climatologías de 30 años correspondientes."

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 2, section 2, first paragraph, last sentence (the PDF spells ERSSTv5 \"ERRSTv5\")"
quote = "La información usada para este cálculo proviene del producto ERRSTv5 de la NOAA para la región Niño 1+2"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 3, section 3, first paragraph"
quote = "Para caracterizar cada condición mensual se han establecido categorías en base al valor del ICEN y el percentil que corresponda respecto al periodo base 1950 a 2023"

