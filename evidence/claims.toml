quote = "The bars show the chance of El Niño (red bars), ENSO-Neutral (grey bars), and La Niña (blue bars) provided for 9 upcoming, overlapping 3-month seasons (each letter represents a month, for example, F = February). The color shading within the bars indicates the chances of different categories of El Niño or La Niña strength (weak, moderate, strong, and very strong)."

[[claim]]
id = "noaa-enso-probability-meaning"
claim_es = "NOAA CPC expresa la intensidad como el porcentaje de probabilidad de cada categoría en cada temporada, verificado con el RONI en Niño 3.4 con umbrales de 0,5 °C; un 0 % es aproximado, no imposible, y la intensidad del evento no equivale necesariamente a la intensidad de su impacto."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/strengths/"
locator = "Official NOAA CPC ENSO Strength Probabilities, paragraph 1"
quote = "Alternatively, the table presents the percent chances of each strength category in numerical form."

[[claim.source]]
