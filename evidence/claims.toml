[[claim]]
id = "noaa-enso-strength-probabilities"
claim_es = "El producto de probabilidades de intensidad de NOAA CPC muestra nueve temporadas móviles de tres meses y categorías de intensidad de El Niño y La Niña."
status = "verified"
