[[claim]]
id = "roni-definition"
claim_es = "El RONI es la media móvil de tres meses de las anomalías de TSM ERSST.v6 en Niño 3.4 menos la anomalía media del trópico (20°N–20°S), ajustada para que su varianza iguale la del índice Niño 3.4. Usa el umbral de ±0,5 °C sobre la base 1991–2020, y NOAA dice que los umbrales y definiciones no cambian respecto del ONI."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/"
locator = "Relative Oceanic Niño Index (RONI): Historical El Niño / La Niña episodes (1950–Present), first paragraph under the title"
quote = "Warm (red) and cold (blue) periods based on a threshold of +/- 0.5°C for the Relative Oceanic Niño Index (RONI), using the 1991–2020 base period [3 month running mean of ERSST.v6 SST anomalies in the Niño 3.4 region (5°N–5°S, 120°–170°W) with average tropical mean (20°N–20°S) SST anomalies subtracted. The difference is then adjusted so the variance equals the original Niño 3.4 index]."

[[claim.source]]
ref = "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/pdf/roni-info-may-2026.pdf"
locator = "RONI circular, PDF p. 1, KEY POINTS, fourth bullet"
quote = "Thresholds and definitions stay the same— only the measurement improves."

