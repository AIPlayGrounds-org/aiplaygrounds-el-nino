[[source]]
id = "enfen-communique"
institution = "Comisión Multisectorial ENFEN"
product = "Comunicado Oficial ENFEN"
block = "Alerts"
verdict = "automatable"
update = "manual"
delivery = "v0.1"
reviewed = "2026-10-02"
page = "https://enfen.imarpe.gob.pe/downloads/comunicados/"
variable = "Estado del sistema de alerta de El Niño Costero"
unit = "Estado oficial"
spatial_resolution = "Costa del Perú"
temporal_resolution = "Por comunicado, cada dos semanas aproximadamente"
data_type = "official"
cadence = "Irregular. In the archive consulted, about every two weeks."
notes = [
  "A person fills `pipeline/inputs/enfen.yaml` from the newest communiqué, about every two weeks and at least once a month. Open the archive, copy the number, date, exact status and detail URL from the communiqué HTML, copy the next-due date it states, set `checked_at` to today, then run `uv run wawapacha-pipeline run enfen-communique` from `pipeline/`. The `update` is `manual` for this reason: due selection never runs it.",
  "The pipeline does not download. It validates the YAML and publishes one record. `access.url` is the archive where the person reads the communiqué.",
  "The status is one of five exact phrases: `No Activo`, `Vigilancia de El Niño Costero`, `Alerta de El Niño Costero`, `Vigilancia de La Niña Costera`, `Alerta de La Niña Costera`. Anything else is rejected, never normalized. The communiqué's own sentence around the phrase varies, so only the phrase is stored.",
  "The URL must be the IMARPE detail page of the same number and year, `https://enfen.imarpe.gob.pe/download/comunicado-oficial-enfen-n-<number>-<year>/`. The PDF is not the canonical link.",
  "Computed: the record's `start` is the communiqué date and its `end` is the next-due date the communiqué states, because the status holds until the next communiqué. `stale` is true when the ingestion date, in Lima time, is after `end`. A stale record means nobody has refreshed the YAML in time. It is recomputed only when the pipeline runs, so the site should also compare `end` with its own build date.",
  "Each communiqué has an HTML page and one PDF. Communiqué No. 17-2026, of 2026-09-28, states `Alerta de El Niño Costero` in the HTML and says the next one is due on 2026-10-15.",
]

[source.access]
kind = "Hand-filled YAML, read from the communiqué HTML"
url = "https://enfen.imarpe.gob.pe/downloads/comunicados/"
format = "YAML: one `enfen` mapping with number, year, date, status, url, next_due and checked_at"
auth = "none"

[[source]]
id = "noaa-oisst"
institution = "NOAA NCEI, distributed by NOAA PSL"
product = "Daily Optimum Interpolation Sea Surface Temperature (OISST), version 2.1"
block = "SST"
verdict = "automatable"
update = "daily"
delivery = "v0.1"
reviewed = "2026-10-02"
page = "https://www.ncei.noaa.gov/products/optimum-interpolation-sst"
variable = "Anomalía de la temperatura superficial del mar respecto a la climatología 1991–2020"
unit = "°C"
data_type = "estimated"
spatial_resolution = "Malla de 0,5° × 0,5° entre 20°N–25°S y 120°W–60°W"
temporal_resolution = "Diaria"
history = "From 1981-09-01. The published file holds only the latest day."
cadence = "Daily, with preliminary data. On 2026-10-02 PSL held up to 2026-10-01. NCEI's final version arrives about two weeks later."
license = "The ERDDAP metadata allow free use and redistribution, with a disclaimer. They do not name a formal license."
reference_period = "1991–2020"
notes = [
  "A level 4 product: it merges satellite (AVHRR and VIIRS) and in situ observations, interpolated onto a complete grid.",
  "Computed here: the daily SST of the latest day minus the PSL daily climatology (`sst.day.mean.ltm.1991-2020.nc`) for the same month and day, on the 0.25° grid. The product's own `anom` variable is not used: it is based on 1971–2000.",
  "The published grid is the mean of each 2 × 2 block of 0.25° cells, ignoring missing cells, rounded to 2 decimals. A block with no value is `null`. The axes are the block centers, with longitude in °E, negative to the west (-119.75 to -60.25).",
  "Baseline checked on 2026-10-02. The climatology file's global metadata says 1971–2000, but its time axis says 1991/01/01–2020/12/31. Over the 38 CPC weeks of 2026 up to 23SEP2026, the mean of this anomaly over the Niño 3.4 box (5°N–5°S, 170°W–120°W) differs from `wksst9120.for` by -0.005 °C on average and by 0.10 °C at most. PSL's own 1971–2000 `anom` differs by +0.07 °C on average and by 0.23 °C at most. The baseline is 1991–2020, the same as CPC's weekly indices. The 1971–2000 text is inherited metadata.",
  "The climatology has 365 days, numbered in the Julian calendar, with no 29 February. 29 February uses 28 February. The pipeline places the day from the first day of the file, because Python decodes the dates two days early.",
  "PSL keeps one SST file per year (`sst.day.mean.<year>.nc`). The pipeline asks for the last 3 days and keeps the latest. In the first days of January the newest day is still in the previous year's file.",
  "NCSS returns the cells just outside the box too (one row and one column). The pipeline keeps the 180 × 240 cells inside it. Land arrives as `NaN`.",
  "Data less than 15 days old is preliminary and can change.",
  "The NCEI ERDDAP returns final data as CSV, about two weeks late. It is not used. Its timestamp query failed with HTTP 400 on 2026-10-02: only the `last` index form works.",
]

[source.access]
kind = "NOAA PSL NCSS (NetCDF subset service)"
url = "https://psl.noaa.gov/thredds/ncss/grid/Datasets/noaa.oisst.v2.highres"
format = "NetCDF classic (`accept=netcdf`): `sst.day.mean.<year>.nc` and `sst.day.mean.ltm.1991-2020.nc`"
auth = "none"

