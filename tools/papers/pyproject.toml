[project]
name = "papers"
version = "0.1.0"
description = "Resolve open-access papers by DOI and read them as Markdown."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.133",
    "httpx>=0.28",
    "torch>=2.14",
    "torchvision>=0.29",
]

[project.scripts]
papers = "papers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
    "pypdfium2>=4",
    "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# The default Linux torch wheels pull about 4 GB of CUDA libraries.
# This tool runs on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
