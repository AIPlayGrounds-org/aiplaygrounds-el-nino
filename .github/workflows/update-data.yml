# Download each source daily and redeploy when any source changes.
# Sources run independently. Failed sources keep their previous JSON, and the
# job reports failures after the remaining sources finish.
name: Update data

on:
  schedule:
    # Run after NOAA CPC's usual US East Coast morning update.
    # Minute 17 avoids the top of the hour, when GitHub most often delays runs.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Id of one source (for example noaa-cpc-oni). Empty: all."
        required: false
        default: ""

permissions:
  contents: write
  # The final step uses `gh workflow run` to start deploy.yml.
  actions: write

# Queue a second run so source updates do not overlap.
concurrency:
  group: update-data
  cancel-in-progress: false

env:
  # Install the pipeline package without notebook dependencies.
  UV_LOCKED: "1"
  UV_NO_DEFAULT_GROUPS: "1"
  # The published worktree is the root of the data branch.
  WAWAPACHA_DATA_DIR: published

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use main even when a manual run starts from another branch.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out the published data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add --detach "$WAWAPACHA_DATA_DIR" FETCH_HEAD
          else
            git worktree add --orphan -b data "$WAWAPACHA_DATA_DIR"
          fi

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Download and validate each source
        id: sources
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          ids=$(uv run --project pipeline wawapacha-pipeline due --data-dir "$WAWAPACHA_DATA_DIR")
          if [ -n "$SOURCE" ]; then ids=$SOURCE; fi

          failed=""
          for id in $ids; do
            echo "::group::$id"
            if ! uv run --project pipeline wawapacha-pipeline run "$id"; then
              echo "::error title=$id::source failed, nothing was published"
              failed="$failed $id"
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Publish the changes to data
        id: commit
        run: |
          ids=""
          while read -r _ path; do
            ids="$ids $(basename "$path" .json)"
          done < <(git -C "$WAWAPACHA_DATA_DIR" status --porcelain -- '*.json')
          ids=${ids# }

          if [ -z "$ids" ]; then
            echo "No changes in published data."
            exit 0
          fi

          git -C "$WAWAPACHA_DATA_DIR" config user.name "github-actions[bot]"
          git -C "$WAWAPACHA_DATA_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WAWAPACHA_DATA_DIR" add -A -- '*.json'
          git -C "$WAWAPACHA_DATA_DIR" commit -m "data: update $ids"
          git -C "$WAWAPACHA_DATA_DIR" push origin HEAD:data
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger other workflows, so start deploy.yml
      # explicitly with workflow_dispatch.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Fail if any source failed
        if: always() && steps.sources.outputs.failed != ''
        env:
          FAILED: ${{ steps.sources.outputs.failed }}
        run: |
          echo "::error::Sources that failed: $FAILED"
          exit 1
