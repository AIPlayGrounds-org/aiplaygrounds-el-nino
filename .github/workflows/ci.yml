# Checks every PR: pipeline tests, generated docs and types up to date, and the web build.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      # Fails if docs/sources.md is stale: run the command and commit the result.
      - run: uv run wawapacha-pipeline sources
      - run: git diff --exit-code ../docs/sources.md
      - run: git diff --exit-code ../web/app/data/source-catalog.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      # Fails if app/types/dataset.ts is stale: run `bun run types` and commit the result.
      - run: bun run types
      - run: git diff --exit-code app/types/dataset.ts
      - run: bun run generate
      - run: bun run check:seo
      - run: bun run check:budget
