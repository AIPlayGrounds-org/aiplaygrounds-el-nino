# Publishes the web to GitHub Pages every time main is updated.
# The site is static: `nuxt generate` reads the seed JSON in data/ at build
# time, after a newer copy from the data branch is overlaid when available.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deploy at a time.
# A new push waits for the deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Overlay the published data branch
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            mkdir -p data
            git archive FETCH_HEAD --format=tar -- '*.json' | tar -x -C data
          else
            echo "No data branch yet; building with the seed snapshot on main."
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # GitHub Pages serves the site from a repository subpath.
      - run: bun run generate
        env:
          PAGES_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
